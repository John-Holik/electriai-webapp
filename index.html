<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElectriAI: Practitioner Knowledge Base for Electrical Construction</title>
  <meta name="description" content="Companion site for the ElectriAI Research paper: 794 YouTube videos and 16,862 viewer Q&A comment threads on electrical construction, a 14,980-question taxonomy with 263 recurring question families, knowledge-bottleneck findings, interactive figures, a labeled comment explorer, a human validation set, and a chatbot grounded in the project knowledge base." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
  <!-- 3d-force-graph (Obsidian-style 3D network) for the theme co-occurrence
       network card in the Research Results tab (js/research.js).
       - three (UMD) exposes window.THREE, required by three-spritetext below
         and used to build the floating node labels.
       - three-spritetext exposes window.SpriteText (needs window.THREE).
       - 3d-force-graph self-contains its own three internally and exposes
         window.ForceGraph3D; it accepts any THREE.Object3D as a node object,
         so the SpriteText labels interoperate fine. -->
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three-spritetext@1.9.0/dist/three-spritetext.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
  <style>
    html { font-family: 'Inter', system-ui, sans-serif; }
    .serif { font-family: 'Source Serif 4', Georgia, serif; }
    html { scroll-behavior: smooth; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .backdrop-blur-modal { backdrop-filter: blur(4px); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 200ms ease-out; }

    /* ─── Ask-the-Knowledge-Base page enrichments ─────────────────────────
       Custom decoration for the chat tab (js/chat.js): a soft gradient hero,
       staggered card rises, animated bar fills, and hover-lift step cards.
       Kept here so the Tailwind CDN build stays config-free. */
    .kb-hero-grid {
      background-image: radial-gradient(circle at 1px 1px, rgba(15,23,42,0.05) 1px, transparent 0);
      background-size: 22px 22px;
    }
    .kb-hero-glow {
      background:
        radial-gradient(120% 130% at 100% 0%, rgba(245,158,11,0.10), transparent 55%),
        radial-gradient(120% 130% at 0% 100%, rgba(56,189,248,0.10), transparent 55%);
    }
    @keyframes kbRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .kb-rise { animation: kbRise 500ms cubic-bezier(.22,1,.36,1) both; }
    @keyframes kbGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .kb-bar-fill { transform-origin: left center; animation: kbGrow 900ms cubic-bezier(.22,1,.36,1) both; }
    .kb-step-card { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .kb-step-card:hover { transform: translateY(-3px); box-shadow: 0 14px 32px -16px rgba(15,23,42,0.35); border-color: #cbd5e1; }
    .kb-suggest { transition: transform .15s ease, border-color .15s ease, background-color .15s ease, box-shadow .15s ease; }
    .kb-suggest:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 24px -14px rgba(15,23,42,0.4); }
    .kb-suggest:disabled { opacity: .5; cursor: not-allowed; }

    /* ─── Videos & Comments page enrichments ─────────────────────────────
       Card hover-lift, thumbnail zoom, and the soft header glow used by the
       Videos & Comments tab (js/rawdata.js). Kept here so the Tailwind CDN
       build stays config-free. */
    .rd-card { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .rd-card:hover { transform: translateY(-3px); box-shadow: 0 16px 34px -18px rgba(15,23,42,0.4); }
    .rd-thumb { transition: transform .3s ease; }
    .rd-card:hover .rd-thumb { transform: scale(1.04); }
    .rd-hero-glow {
      background:
        radial-gradient(120% 130% at 100% 0%, rgba(56,189,248,0.10), transparent 55%),
        radial-gradient(120% 130% at 0% 100%, rgba(245,158,11,0.10), transparent 55%);
    }
  </style>
</head>
<body class="bg-stone-50 text-slate-900 antialiased">
  <div id="root"></div>

  <!--
    The application is split across multiple files for maintainability.
    Each file registers its components onto a window.App* namespace, and
    app.js reads from there. All scripts use type="text/babel" so that
    Babel transpiles JSX in the browser. Add a new tab by creating a
    new file in js/ and registering it the same way.
  -->
  <script src="./js/utils.js" type="text/babel" data-presets="react"></script>
  <script src="./js/components.js" type="text/babel" data-presets="react"></script>
  <script src="./js/research.js" type="text/babel" data-presets="react"></script>
  <script src="./js/comments.js" type="text/babel" data-presets="react"></script>
  <script src="./js/rawdata.js" type="text/babel" data-presets="react"></script>
  <script src="./js/chat.js" type="text/babel" data-presets="react"></script>
  <script src="./js/about.js" type="text/babel" data-presets="react"></script>
  <script src="./js/qa.js" type="text/babel" data-presets="react"></script>
  <script src="./js/app.js" type="text/babel" data-presets="react"></script>
</body>
</html>
