<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElectriAI, YouTube Q&A Knowledge for Electrical Contractors</title>
  <meta name="description" content="Companion site for the ElectriAI Research paper: 794 YouTube videos and 18,000 viewer Q&A comments on electrical-construction topics, with figures, a labeled comment explorer, and a chatbot grounded in a markdown knowledge base." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
  <!-- 3d-force-graph (Obsidian-style 3D network) for the theme co-occurrence
       network card in the Research Results tab (js/research.js).
       - three (UMD) exposes window.THREE, required by three-spritetext below
         and used to build the floating node labels.
       - three-spritetext exposes window.SpriteText (needs window.THREE).
       - 3d-force-graph self-contains its own three internally and exposes
         window.ForceGraph3D; it accepts any THREE.Object3D as a node object,
         so the SpriteText labels interoperate fine. -->
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three-spritetext@1.9.0/dist/three-spritetext.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
  <style>
    html { font-family: 'Inter', system-ui, sans-serif; }
    .serif { font-family: 'Source Serif 4', Georgia, serif; }
    html { scroll-behavior: smooth; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .backdrop-blur-modal { backdrop-filter: blur(4px); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 200ms ease-out; }
  </style>
</head>
<body class="bg-stone-50 text-slate-900 antialiased">
  <div id="root"></div>

  <!--
    The application is split across multiple files for maintainability.
    Each file registers its components onto a window.App* namespace, and
    app.js reads from there. All scripts use type="text/babel" so that
    Babel transpiles JSX in the browser. Add a new tab by creating a
    new file in js/ and registering it the same way.
  -->
  <script src="./js/utils.js" type="text/babel" data-presets="react"></script>
  <script src="./js/components.js" type="text/babel" data-presets="react"></script>
  <script src="./js/research.js" type="text/babel" data-presets="react"></script>
  <script src="./js/comments.js" type="text/babel" data-presets="react"></script>
  <script src="./js/rawdata.js" type="text/babel" data-presets="react"></script>
  <script src="./js/chat.js" type="text/babel" data-presets="react"></script>
  <script src="./js/about.js" type="text/babel" data-presets="react"></script>
  <script src="./js/app.js" type="text/babel" data-presets="react"></script>
</body>
</html>
